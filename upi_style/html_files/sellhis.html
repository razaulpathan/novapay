<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sixpay - Sell History</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #2395ee;
      --deep-blue: #07588f;
      --soft-blue: #f8fcff;
      --line: #e8f1f7;
      --muted: #b8c0c8;
      --bg-color: #f7f9fc;
      --text-dark: #333333;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef2f5;
      color: var(--text-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .screen {
      width: min(100%, 574px);
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      padding-bottom: 80px; /* Space for fixed bottom nav */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    /* Header styling */
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #f5f7fa;
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 10;
    }

    .header-back {
      color: #2c3e50;
      text-decoration: none;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .header-back svg {
      width: 24px;
      height: 24px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #2c3e50;
      margin: 0 auto;
      transform: translateX(-12px); /* Centering offset */
    }

    .content {
      padding: 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Sub Tabs */
    .sub-tabs {
      display: flex;
      width: 100%;
      border-bottom: 1.5px solid #f0f3f6;
      background: #ffffff;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      cursor: pointer;
      color: #7f8c8d;
      font-size: 16px;
      font-weight: bold;
      position: relative;
      transition: color 0.2s;
    }

    .tab-item.active {
      color: var(--blue);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -1.5px;
      left: 42%;
      width: 16%;
      height: 3px;
      background: var(--blue);
      border-radius: 2px;
    }

    /* Empty state layout */
    .empty-state-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      gap: 16px;
      flex: 1;
    }

    .stats-icon-wrapper {
      width: 180px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #85c1e9;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .empty-text {
      font-size: 13.5px;
      font-weight: bold;
      color: #2c3e50;
      line-height: 1.5;
      margin: 0;
      max-width: 460px;
    }

    .action-btn {
      margin-top: 14px;
      width: 100%;
      max-width: 320px;
      height: 52px;
      border: none;
      background: #2395ee;
      color: #ffffff;
      border-radius: 26px;
      font: 800 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(35, 149, 238, 0.25);
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .action-btn:hover {
      background: #0d7dd4;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Floating Chat Button */
    .fab {
      position: absolute;
      bottom: 24px;
      right: 18px;
      width: 48px;
      height: 48px;
      background: #3a6bf6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 12px rgba(58, 107, 246, 0.4);
      cursor: pointer;
      z-index: 10;
    }

    .fab svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="screen">
    
    <!-- Header title -->
    <header class="header">
      <a href="mine.html" class="header-back">
        <!-- Back chevron SVG -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <h1 class="header-title">Sell history</h1>
    </header>

    <div class="content">
      
      <!-- Sub tabs -->
      <nav class="sub-tabs">
        <div class="tab-item active" id="tabPaying" onclick="switchSellTab('paying')">Paying</div>
        <div class="tab-item" id="tabSuccess" onclick="switchSellTab('success')">Success</div>
        <div class="tab-item" id="tabAll" onclick="switchSellTab('all')">All</div>
      </nav>

      <!-- Empty state view -->
      <div class="empty-state-view">
        <div class="stats-icon-wrapper">
          <!-- Stats line chart illustration SVG -->
          <svg viewBox="0 0 160 120" style="width: 140px; height: 110px;">
            <rect x="10" y="20" width="140" height="80" rx="10" fill="none" stroke="#2395ee" stroke-width="6" opacity="0.8"/>
            <rect x="25" y="80" width="110" height="20" rx="3" fill="#cbd9e6" opacity="0.3"/>
            <!-- Line graph -->
            <path d="M25 75 L 55 50 L 75 60 L 105 35 L 135 55" fill="none" stroke="#2395ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M25 75 L 55 50 L 75 60 L 105 35 L 135 55 L 135 85 L 25 85 Z" fill="#2395ee" opacity="0.15"/>
          </svg>
        </div>
        <p class="empty-text" id="emptyText">
          There are no sales orders at the moment. If you have enabled consignment, please check the authorization of the key partner and whether the kyc partner can receive payment normally or contact customer service in time
        </p>
        
        <a href="kycpa.html" class="action-btn">Check Sell state</a>
      </div>

    </div>

    <!-- Floating Chat Button -->
    <div class="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        <circle cx="9" cy="10" r="1"></circle>
        <circle cx="13" cy="10" r="1"></circle>
        <circle cx="17" cy="10" r="1"></circle>
      </svg>
    </div>

  </div>

  <script>
    function switchSellTab(tabName) {
      const tabPaying = document.getElementById('tabPaying');
      const tabSuccess = document.getElementById('tabSuccess');
      const tabAll = document.getElementById('tabAll');
      const emptyText = document.getElementById('emptyText');

      // Reset active tabs
      tabPaying.classList.remove('active');
      tabSuccess.classList.remove('active');
      tabAll.classList.remove('active');

      if (tabName === 'paying') {
        tabPaying.classList.add('active');
        emptyText.textContent = "There are no sales orders at the moment. If you have enabled consignment, please check the authorization of the key partner and whether the kyc partner can receive payment normally or contact customer service in time";
      } else if (tabName === 'success') {
        tabSuccess.classList.add('active');
        emptyText.textContent = "No successful sales history found";
      } else {
        tabAll.classList.add('active');
        emptyText.textContent = "No sales orders found under any status";
      }
    }
  </script>
</body>
</html>
