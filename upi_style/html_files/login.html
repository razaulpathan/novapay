<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sixpay Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #2395ee;
      --deep-blue: #07588f;
      --soft-blue: #f8fcff;
      --line: #e8f1f7;
      --muted: #b8c0c8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--deep-blue);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: min(100%, 574px);
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      padding: 48px 30px 28px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 4px auto 104px;
    }

    .logo-mark {
      width: 142px;
      height: 168px;
      flex: 0 0 auto;
    }

    .brand {
      color: var(--deep-blue);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(66px, 15vw, 96px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
    }

    .form {
      width: 100%;
    }

    .field {
      position: relative;
      display: flex;
      align-items: center;
      height: 76px;
      margin: 0 8px 28px;
      border-radius: 42px;
      background: var(--soft-blue);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .field svg {
      width: 34px;
      height: 34px;
      margin-left: 28px;
      color: #1c94df;
      flex: 0 0 auto;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 0 22px 0 16px;
      color: #3f596b;
      font: 700 19px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .field input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: -4px 30px 54px 8px;
      color: #0f8edd;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .save {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
    }

    .radio {
      width: 22px;
      height: 22px;
      border: 2px solid #c9cfd4;
      border-radius: 50%;
      display: inline-block;
      background: #fff;
      flex: 0 0 auto;
    }

    .forgot {
      color: #0f8edd;
      text-decoration: none;
      white-space: nowrap;
    }

    .login-btn {
      width: 100%;
      height: 76px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font: 800 22px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-shadow: none;
    }

    .agreement {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 7px;
      color: #197cbd;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    .check {
      width: 31px;
      height: 31px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      flex: 0 0 auto;
    }

    .agreement a {
      color: #197cbd;
      text-decoration: underline;
    }

    @media (max-width: 430px) {
      .screen {
        padding: 42px 22px 24px;
      }

      .logo {
        gap: 12px;
        margin-bottom: 96px;
      }

      .logo-mark {
        width: 116px;
        height: 138px;
      }

      .brand {
        font-size: 70px;
      }

      .field {
        height: 68px;
        margin-left: 8px;
        margin-right: 8px;
      }

      .options {
        margin-right: 8px;
        font-size: 16px;
      }

      .login-btn {
        height: 68px;
      }
    }

    @media (max-width: 360px) {
      .screen {
        padding-left: 18px;
        padding-right: 18px;
      }

      .logo {
        gap: 8px;
      }

      .logo-mark {
        width: 96px;
        height: 116px;
      }

      .brand {
        font-size: 56px;
      }

      .options {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="logo" aria-label="Sixpay">
      <svg class="logo-mark" viewBox="0 0 160 185" role="img" aria-label="Sixpay logo">
        <path d="M109 2C70 4 35 27 17 62-6 106 9 163 51 180c39 16 88-3 102-44 12-36-5-77-40-94-14-7-31-9-44-5-5 2-8-5-4-9C75 18 89 11 109 8c5-1 7-7 0-6Z" fill="#07588f"/>
        <rect x="44" y="95" width="72" height="54" rx="12" fill="none" stroke="#fff" stroke-width="8"/>
        <rect x="61" y="114" width="18" height="12" rx="3" fill="#fff"/>
        <path d="M106 49c16 7 25 20 28 38" fill="none" stroke="#07588f" stroke-width="9" stroke-linecap="round"/>
        <path d="M119 30c23 10 36 29 39 55" fill="none" stroke="#07588f" stroke-width="9" stroke-linecap="round"/>
        <path d="M94 67c9 5 15 13 17 24" fill="none" stroke="#07588f" stroke-width="9" stroke-linecap="round"/>
      </svg>
      <div class="brand">Sixpay</div>
    </section>

    <form class="form">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="2" width="10" height="20" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 5h4M10.5 19h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="tel" placeholder="Enter phone number" autocomplete="tel">
      </label>

      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input type="password" placeholder="Enter password" autocomplete="current-password">
      </label>

      <div class="options">
        <label class="save">
          <span class="radio" aria-hidden="true"></span>
          <span>Save Password</span>
        </label>
        <a class="forgot" href="#">Forgot password</a>
      </div>

      <button class="login-btn" type="submit">Login</button>

      <div class="agreement">
        <span class="check" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M5 12.4 9.3 17 19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Agree <a href="#">“User Privacy Agreement”</a></span>
      </div>
    </form>
  </main>
</body>
</html>
